[package]
name = "tieba-crawler"
version = "0.2.0"
description = "Baidu Tieba public-content research desktop app"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "tieba_crawler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_xlsxwriter = "0.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
